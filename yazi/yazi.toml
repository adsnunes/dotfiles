# graphite · yazi: arquivos de texto abrem no nvim, bloqueando o yazi até sair
[opener]
edit = [{ run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" }]

[open]
prepend_rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "application/{json,x-ndjson,toml,x-yaml}", use = "edit" },
	{ url = "*.py", use = "edit" },
]
