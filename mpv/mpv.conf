# graphite · mpv
hwdec=auto-safe
vo=gpu
ytdl-format=bestvideo[height<=720][vcodec!^=av01]+bestaudio/best[height<=720]
keep-open=no
autofit-larger=80%x80%
background-color="#2f3134"

osd-font="JetBrainsMono Nerd Font"
osd-font-size=20
osd-color="#d0d1d2"
osd-border-size=0
osd-shadow-offset=0
osd-back-color="#cc2f3134"
osd-margin-x=24
osd-margin-y=20
osd-bar-h=1.2
osd-bar-align-y=0.94

sub-font="JetBrainsMono Nerd Font"
sub-font-size=34
sub-border-size=0
sub-back-color="#aa2f3134"

script-opts-append=osc-layout=bottombar
script-opts-append=osc-seekbarstyle=bar
script-opts-append=osc-hidetimeout=900
script-opts-append=osc-boxalpha=40
