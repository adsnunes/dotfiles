# graphite · picom 13
backend = "glx";
vsync = true;
use-damage = true;

corner-radius = 8;
rounded-corners-exclude = [ "class_g = 'Polybar'", "window_type = 'dock'" ];

shadow = true;
shadow-radius = 18;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-opacity = 0.35;
shadow-exclude = [ "class_g = 'Polybar'", "window_type = 'dock'", "_GTK_FRAME_EXTENTS@" ];

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [ "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@" ];

animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.22;
    scale = 0.96;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.16;
    scale = 0.96;
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.2;
  }
);
