; graphite · polybar
include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24
offset-y = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=7.5:weight=medium;2"
modules-left = agents media
modules-center = workspaces
modules-right = cpu memory volume battery wifi time
cursor-click = pointer
enable-ipc = true
wm-restack = i3
override-redirect = false

[module/workspaces]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = false
format = <label-state>
label-focused = [ %index% ]
label-focused-foreground = ${colors.hi}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 2
label-visible = %index%
label-visible-foreground = ${colors.muted}
label-visible-padding = 2
label-urgent = ! %index% !
label-urgent-foreground = ${colors.hi}
label-urgent-padding = 1

[module/agents]
type = custom/script
exec = ~/.local/bin/agents
interval = 10
format-foreground = ${colors.fg}
click-left = i3-msg -q workspace number 1

[bar/focus]
inherit = bar/main
modules-left =
modules-center = focus
modules-right =

[module/focus]
type = custom/script
exec = ~/.local/bin/focus left
interval = 1
format-foreground = ${colors.hi}
click-left = ~/.local/bin/focus stop

[module/media]
type = custom/script
exec = ~/.local/bin/media
tail = true
click-left = playerctl play-pause
click-right = playerctl next
scroll-up = playerctl previous
scroll-down = playerctl next
format-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 3
label = [ CPU: %percentage:2% ]
format-foreground = ${colors.muted}

[module/memory]
type = internal/memory
interval = 5
label = [ MEM: %percentage_used:2% ]
format-foreground = ${colors.muted}

[module/volume]
type = internal/pulseaudio
use-ui-max = false
label-volume = [ VOL: %percentage% ]
label-muted = [ VOL: -- ]
label-muted-foreground = ${colors.dim}
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
poll-interval = 10
label-charging = [ BAT: %percentage%+ ]
label-discharging = [ BAT: %percentage% ]
label-full = [ BAT: FULL ]

[module/wifi]
type = internal/network
interface-type = wireless
interval = 5
label-connected = [ WIFI: YES ]
label-disconnected = [ WIFI: NO ]
label-disconnected-foreground = ${colors.dim}

[module/time]
type = internal/date
interval = 5
date = %H:%M
date-alt = %a %d %b · %H:%M
label = [ TIME: %date% ]
label-foreground = ${colors.hi}

[settings]
screenchange-reload = true
